        if ('caches' in window) {
            caches.keys().then(function (names) {
                for (let name of names) caches.delete(name);

    <script>
        (function () {
            const lsKey = "judge0.theme";
            const savedTheme = localStorage.getItem(lsKey);
            const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            const theme = savedTheme ? savedTheme.replace(/"/g, '') : "light";
            const resolvedTheme = (theme === "system") ? systemTheme : (theme === "reverse-system" ? (systemTheme === "dark" ? "light" : "dark") : theme);
            const isLight = resolvedTheme === "light";
            document.documentElement.setAttribute("data-theme", isLight ? "light" : "dark");
            window.addEventListener("DOMContentLoaded", () => {
                const darkStyle = document.getElementById("judge0-golden-layout-dark-theme-stylesheet");
                const lightStyle = document.getElementById("judge0-golden-layout-light-theme-stylesheet");
                if (darkStyle) darkStyle.disabled = isLight;
                if (lightStyle) lightStyle.disabled = !isLight;
            });
        })();
    </script>
